# ros2_control de las ruedas mecanum de Martha en Gazebo (drive:=mecanum). Viene de martha_nav.
# Pendiente de Estructura: conectar /cmd_vel con la entrada del controlador
# (/mecanum_drive_controller/reference, TwistStamped) y su odometría con /base/odom.
controller_manager:
  ros__parameters:
    # Veces por segundo que se leen las ruedas y se mandan comandos.
    update_rate: 100

    # Publica /joint_states (ángulo de cada rueda) para robot_state_publisher.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Cinemática mecanum: velocidad del cuerpo (vx, vy, w) <-> velocidad de cada rueda.
    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

mecanum_drive_controller:
  ros__parameters:
    # Si no llega un comando en 0.5 s, las ruedas se detienen.
    reference_timeout: 0.5
    front_left_wheel_command_joint_name: base_front_left_wheel_joint
    front_right_wheel_command_joint_name: base_front_right_wheel_joint
    rear_left_wheel_command_joint_name: base_rear_left_wheel_joint
    rear_right_wheel_command_joint_name: base_rear_right_wheel_joint

    kinematics:
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
      wheels_radius: 0.075
      # lx + ly = 0.21 + 0.175 con las ruedas donde las pone martha.urdf.xacro.
      # (martha_nav tenía 0.375, de cuando las ruedas estaban en x = 0.20.)
      sum_of_robot_center_projection_on_X_Y_axis: 0.385

    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
