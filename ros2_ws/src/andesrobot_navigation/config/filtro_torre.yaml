# Filtro del lidar de Martha: /nav/scan -> /nav/scan_filtered (interno de Navegación).
#
# Los 4 postes de la torre de aluminio cruzan el plano del lidar, así que el lidar los ve (en
# Gazebo y en la Martha real). Si esos puntos llegan a los costmaps, Nav2 cree que tiene un
# obstáculo ENCIMA del robot y no se mueve. Este filtro borra todo punto que caiga dentro de la
# caja del robot.
#
# LaserScanBoxFilter: pasa cada lectura del scan a coordenadas de box_frame (con TF) y, si cae
# dentro de la caja [min, max], la reemplaza por NaN (= "lectura inválida", Nav2 la ignora).
# La caja es la huella de Martha (0.58 x 0.41 m, la caja de contacto del URDF) con 1 cm de margen,
# en base_footprint (el centro del robot en el suelo). Los postes (20 x 40 mm) están en
# x = -0.033 y -0.208, y = ±0.11, a 0.226 y 0.391 m detrás del lidar (Martha medida el 2026-10-21).
#
# Nombre del nodo (name= en navigation.launch.py).
filtro_torre:
  ros__parameters:
    filter1:
      name: torre
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_footprint
        min_x: -0.30
        max_x: 0.30
        min_y: -0.215
        max_y: 0.215
        # Alto de la caja: desde el suelo hasta 1 m. Basta con que cubra el plano del lidar
        # (0.231 m), que es donde caen todas las lecturas del scan.
        min_z: -0.10
        max_z: 1.00
        # false = borrar lo que está DENTRO de la caja (true = quedarse solo con eso).
        invert: false
